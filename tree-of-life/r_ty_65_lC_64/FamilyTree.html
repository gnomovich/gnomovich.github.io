<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árvore Genealógica</title>
<style>
  :root {
    --fundo: #10141c;
    --painel: #171d28;
    --painel2: #1e2634;
    --borda: #2c3648;
    --texto: #e8edf5;
    --suave: #93a1b8;
    --acento: #ffd166;
    --acento2: #6ba3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
  }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #chart.a-mover { cursor: grabbing; }
  button { font: inherit; color: inherit; }

  /* ---------- aviso quando nao ha dados ---------- */
  .aviso { margin: 4rem auto; max-width: 42rem; text-align: center; color: var(--suave); }
  .aviso code { background: var(--painel2); padding: .1rem .35rem; border-radius: 4px; color: var(--texto); }

  /* ---------- painel de controlos ---------- */
  #controlos {
    position: absolute; top: 14px; left: 14px; width: 268px; z-index: 5;
    background: color-mix(in srgb, var(--painel) 92%, transparent);
    border: 1px solid var(--borda); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    backdrop-filter: blur(8px);
    max-height: calc(100% - 28px); display: flex; flex-direction: column;
  }
  #controlos header {
    display: flex; align-items: center; gap: .5rem; padding: .6rem .75rem;
    border-bottom: 1px solid var(--borda); flex: none;
  }
  #controlos header h1 { font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); margin: 0; flex: 1; font-weight: 600; }
  #controlos.fechado #corpoControlos { display: none; }
  #controlos.fechado header { border-bottom: 0; }
  #corpoControlos { padding: .35rem .75rem .75rem; overflow-y: auto; }
  .linha { margin: .55rem 0; }
  .linha > label { display: flex; justify-content: space-between; align-items: baseline; font-size: .78rem; color: var(--suave); margin-bottom: .2rem; }
  .linha > label b { color: var(--texto); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acento2); height: 18px; }
  select, input[type=text] {
    width: 100%; background: var(--painel2); color: var(--texto);
    border: 1px solid var(--borda); border-radius: 7px; padding: .35rem .5rem; font: inherit; font-size: .85rem;
  }
  input[type=text]::placeholder { color: #5f6d84; }
  .checks { display: grid; gap: .3rem; }
  .checks label { display: flex; align-items: center; gap: .45rem; font-size: .85rem; color: var(--texto); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--acento2); width: 15px; height: 15px; }
  .botoes { display: flex; gap: .4rem; margin-top: .6rem; }
  .botoes button, .bt {
    flex: 1; background: var(--painel2); border: 1px solid var(--borda); border-radius: 8px;
    padding: .4rem .5rem; font-size: .82rem; cursor: pointer; transition: background .12s, border-color .12s;
  }
  .botoes button:hover, .bt:hover { background: #28313f; border-color: #3d4a60; }
  .bt.principal { background: #2b3d5e; border-color: #3d5c8c; }
  .bt.principal:hover { background: #34496f; }

  /* ---------- resultados da busca ---------- */
  #resultados { margin-top: .3rem; display: grid; gap: .15rem; max-height: 190px; overflow-y: auto; }
  #resultados:empty { display: none; }
  #resultados button {
    display: flex; align-items: center; gap: .45rem; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    padding: .28rem .4rem; cursor: pointer; font-size: .84rem;
  }
  #resultados button:hover { background: var(--painel2); border-color: var(--borda); }
  .ponto { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35) inset; }
  #resultados small { color: var(--suave); margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---------- painel lateral ---------- */
  #painel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 372px; max-width: 92vw; z-index: 6;
    background: var(--painel); border-left: 1px solid var(--borda);
    display: flex; flex-direction: column;
    transform: translateX(102%); transition: transform .22s ease;
  }
  #painel.aberto { transform: none; }
  #painel > header { padding: .9rem 1rem .7rem; border-bottom: 1px solid var(--borda); position: relative; flex: none; }
  #painel h2 { margin: 0 0 .15rem; font-size: 1.12rem; line-height: 1.25; padding-right: 1.6rem; }
  #painel .sub { color: var(--suave); font-size: .82rem; }
  #painel .fechar {
    position: absolute; top: .6rem; right: .6rem; width: 28px; height: 28px; border-radius: 7px;
    background: transparent; border: 1px solid transparent; font-size: 1.15rem; line-height: 1; cursor: pointer; color: var(--suave);
  }
  #painel .fechar:hover { background: var(--painel2); border-color: var(--borda); color: var(--texto); }
  #corpoPainel { padding: .2rem 1rem 2.5rem; overflow-y: auto; flex: 1; }
  .acoes { display: flex; gap: .4rem; margin-top: .6rem; }
  .sec { margin-top: 1.1rem; }
  .sec > h3 {
    font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--suave);
    margin: 0 0 .4rem; font-weight: 700;
  }
  .dados { display: grid; grid-template-columns: 5.6rem 1fr; gap: .22rem .6rem; font-size: .87rem; }
  .dados dt { color: var(--suave); }
  .dados dd { margin: 0; }
  .lista { display: grid; gap: .2rem; }
  .pessoa {
    display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
    background: var(--painel2); border: 1px solid var(--borda); border-radius: 8px;
    padding: .32rem .5rem; cursor: pointer; font-size: .87rem;
  }
  .pessoa:hover { border-color: #46577a; background: #232c3c; }
  .pessoa .papel { color: var(--suave); font-size: .76rem; flex: none; }
  .pessoa .quem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pessoa .quando { color: var(--suave); font-size: .76rem; font-variant-numeric: tabular-nums; flex: none; }
  .pessoa.novo .quem::after { content: " ?"; color: #6f7f99; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; background: var(--painel2); border: 1px solid var(--borda); border-radius: 999px; padding: .1rem .5rem; font-size: .78rem; margin: 0 .25rem .25rem 0; }
  .notas { font-size: .87rem; color: #cfd8e6; }
  .notas p { margin: 0 0 .6rem; }
  .notas ul { margin: .2rem 0 .6rem; padding-left: 1.15rem; }
  .notas li { margin: .1rem 0; }
  .notas a, .notas .wl { color: var(--acento2); cursor: pointer; text-decoration: none; border-bottom: 1px dotted rgba(107,163,255,.5); }
  .notas .wl.sem { color: var(--suave); border-bottom-color: rgba(147,161,184,.35); }
  .docs { display: grid; gap: .2rem; }
  .docs a { color: var(--acento2); text-decoration: none; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs a:hover { text-decoration: underline; }
  .rodape { margin-top: 1.3rem; padding-top: .7rem; border-top: 1px solid var(--borda); color: #6f7f99; font-size: .76rem; line-height: 1.7; }
  .rodape code { background: var(--painel2); padding: .05rem .3rem; border-radius: 4px; }

  /* ---------- tooltip + hud ---------- */
  #dica {
    position: absolute; z-index: 8; pointer-events: none; max-width: 320px;
    background: rgba(12, 16, 23, .96); border: 1px solid var(--borda); border-radius: 9px;
    padding: .45rem .6rem; font-size: .82rem; box-shadow: 0 10px 26px rgba(0,0,0,.5); line-height: 1.45;
  }
  #dica[hidden] { display: none; }
  #dica b { display: block; }
  #dica span { color: var(--suave); }
  #hud {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 4;
    color: #64728a; font-size: .74rem; text-align: center; pointer-events: none; white-space: nowrap;
  }
  @media (max-width: 820px) {
    #controlos { width: 232px; }
    #painel { width: 100%; max-width: none; }
  }
</style>
</head>
<body>
<canvas id="chart"></canvas>

<section id="controlos">
  <header>
    <h1>Árvore Genealógica</h1>
    <button class="bt" id="alternarControlos" title="Mostrar/ocultar controlos" style="flex:none;padding:.15rem .45rem">▾</button>
  </header>
  <div id="corpoControlos">
    <div class="linha">
      <label for="busca">Pessoa central</label>
      <input type="text" id="busca" placeholder="procurar pelo nome…" autocomplete="off" spellcheck="false">
      <div id="resultados"></div>
    </div>
    <div class="linha">
      <label for="geracoes">Gerações <b id="vGeracoes"></b></label>
      <input type="range" id="geracoes" min="1" max="8" step="1">
    </div>
    <div class="linha">
      <label for="abertura">Abertura do leque <b id="vAbertura"></b></label>
      <input type="range" id="abertura" min="60" max="360" step="5">
    </div>
    <div class="linha">
      <label for="rotacao">Rotação <b id="vRotacao"></b></label>
      <input type="range" id="rotacao" min="-180" max="180" step="5">
    </div>
    <div class="linha">
      <label for="espaco">Espaço entre setores <b id="vEspaco"></b></label>
      <input type="range" id="espaco" min="0" max="10" step="0.5">
    </div>
    <div class="linha">
      <label for="zoom">Zoom <b id="vZoom"></b></label>
      <input type="range" id="zoom" min="30" max="260" step="5">
    </div>
    <div class="linha">
      <label for="cores">Cor por</label>
      <select id="cores">
        <option value="apelido">Apelido</option>
        <option value="geracao">Geração</option>
        <option value="sexo">Sexo</option>
      </select>
    </div>
    <div class="linha checks">
      <label><input type="checkbox" id="ckDatas"> Mostrar datas</label>
      <label><input type="checkbox" id="ckLocais"> Mostrar locais</label>
      <label><input type="checkbox" id="ckVazios"> Marcar lacunas</label>
      <label><input type="checkbox" id="ckCurtos"> Nomes abreviados</label>
    </div>
    <div class="botoes">
      <button id="btRecentrar">Recentrar</button>
      <button id="btPng">Guardar PNG</button>
    </div>
  </div>
</section>

<aside id="painel">
  <header>
    <h2 id="pNome">—</h2>
    <div class="sub" id="pSub"></div>
    <button class="fechar" id="btFechar" title="Fechar">×</button>
  </header>
  <div id="corpoPainel"></div>
</aside>

<div id="dica" hidden></div>
<div id="hud"></div>

if (!DATA || !DATA.pessoas) {
  document.body.innerHTML =
    '<p class="aviso">Este ficheiro ainda não contém dados.<br>Execute <code>python _Scripts/export_tree.py</code> para o gerar a partir das notas de <code>Pessoas/</code>.</p>';
  return;
}

const P = DATA.pessoas;
const PALETA = DATA.coresApelidos;
const VAULT = DATA.meta.vault;
const RAD = Math.PI / 180;
const HOLE = 0.11;                       // raio do centro (fração do raio total)
const CORES_GERACAO = ["#ffd166", "#8ecae6", "#90be6d", "#f28482", "#cdb4db",
                       "#f4a261", "#b5e48c", "#9bb1ff", "#e0aaff"];

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const dica = document.getElementById("dica");
const painel = document.getElementById("painel");
const hud = document.getElementById("hud");

const state = {
  raiz: DATA.meta.raiz,
  geracoes: 4,
  abertura: 180,
  rotacao: 0,
  espaco: 3,
  zoom: 100,
  panX: 0,
  panY: 0,
  datas: true,
  locais: true,
  vazios: true,
  curtos: false,
  cores: "apelido",
  selecionado: null,
  sobre: null,
};

let slots = [];      // setores calculados no último desenho
let vista = null;    // { escala, cx, cy }
let dpr = 1;

/* ---------------------------------------------------------------- helpers */
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const semAcentos = (s) => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const norm = (s) => semAcentos(s).toLowerCase().trim();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function nomeDe(p) {
  return p ? p.nome + (p.desambiguacao ? " " + p.desambiguacao : "") : "?";
}
function nomeCurto(p) {
  const partes = nomeDe(p).split(/\s+/);
  if (partes.length <= 2) return nomeDe(p);
  return partes[0] + " " + partes[partes.length - 1];
}
function anosDe(p) {
  const n = p.nascimento && p.nascimento.year;
  const m = p.obito && p.obito.year;
  if (!n && !m) return "";
  if (n && m) return n + "–" + m;
  if (n) return n + "–";
  return "†" + m;
}
function dataPt(o) {
  if (!o) return "";
  if (o.iso) {
    const [a, m, d] = o.iso.split("-");
    return d + "/" + m + "/" + a;
  }
  if (o.year) return (o.uncertain ? "c. " : "") + o.year;
  return "";
}
function localDe(o) { return (o && o.local) || ""; }
function conj(o) {
  const partes = [dataPt(o), localDe(o)].filter(Boolean);
  return partes.join(", ");
}
function hexParaRgb(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.replace(/./g, (c) => c + c) : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function escurecer(hex, f) {
  const [r, g, b] = hexParaRgb(hex);
  const m = (v) => Math.round(v * f);
  return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")";
}
function rgba(hex, a) {
  const [r, g, b] = hexParaRgb(hex);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
const pol = (bearing, r) => [r * Math.sin(bearing * RAD), -r * Math.cos(bearing * RAD)];
const ang = (bearing) => (bearing - 90) * RAD;

/* -------------------------------------------------------------- geometria */
function setorAbertura(s) {
  const w = s.b1 - s.b0;
  const g = Math.min(state.espaco, w * 0.6) / 2;
  return [s.b0 + g, s.b1 - g];
}

function dentro(b, b0, b1) {
  const d = (((b - b0) % 360) + 360) % 360;
  return d <= b1 - b0;
}

function construirSlots() {
  const g = state.geracoes;
  const grelha = [[state.raiz]];
  for (let n = 1; n <= g; n++) {
    const largura = 1 << n;
    const linha = new Array(largura).fill(null);
    for (let j = 0; j < largura; j++) {
      const paiDoSlot = grelha[n - 1][j >> 1];
      if (!paiDoSlot) continue;
      const p = P[paiDoSlot];
      if (!p) continue;
      linha[j] = j % 2 === 0 ? p.pai : p.mae;
    }
    grelha.push(linha);
  }

  const t = (1 - HOLE) / g;
  const saida = [];
  for (let n = 1; n <= g; n++) {
    const largura = 1 << n;
    const w = state.abertura / largura;
    for (let j = 0; j < largura; j++) {
      const b0 = -state.abertura / 2 + state.rotacao + j * w;
      saida.push({
        gen: n, idx: j, key: n + ":" + j, id: grelha[n][j], pai: grelha[n - 1][j >> 1] || null,
        b0: b0, b1: b0 + w,
        r0: HOLE + (n - 1) * t,
        r1: HOLE + n * t,
      });
    }
  }
  return saida;
}

function transformacao() {
  const cw = canvas.clientWidth || 800;
  const ch = canvas.clientHeight || 600;
  const a0 = -state.abertura / 2 + state.rotacao;
  const a1 = a0 + state.abertura;
  const amostras = [a0, a1];
  for (let c = -720; c <= 720; c += 90) if (c > a0 && c < a1) amostras.push(c);
  if (state.abertura >= 359) amostras.push(a0 + 90, a0 + 180, a0 + 270);
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  for (const a of amostras) {
    const [x, y] = pol(a, 1);
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const margem = 22;
  const base = Math.min((cw - margem * 2) / Math.max(maxX - minX, 1e-6),
                        (ch - margem * 2) / Math.max(maxY - minY, 1e-6));
  const escala = base * (state.zoom / 100);
  const cx = cw / 2 - ((minX + maxX) / 2) * escala + state.panX;
  const cy = ch / 2 - ((minY + maxY) / 2) * escala + state.panY;
  return { escala, cx, cy };
}

function corDe(p, gen) {
  if (state.cores === "geracao") return CORES_GERACAO[(gen - 1 + CORES_GERACAO.length) % CORES_GERACAO.length];
  if (state.cores === "sexo") return p.sex === "F" ? "#f28482" : p.sex === "M" ? "#8ecae6" : "#c2cbd8";
  return PALETA[p.apelido] || PALETA.outro;
}

/* ------------------------------------------------------------------ texto */
function encurtar(txt, max) {
  if (max <= 8) return "";
  if (ctx.measureText(txt).width <= max) return txt;
  let s = txt;
  while (s.length > 2 && ctx.measureText(s + "…").width > max) s = s.slice(0, -1);
  return s.trim() + "…";
}
function quebrar(txt, max, maxLinhas) {
  const palavras = txt.split(/\s+/);
  const linhas = [];
  let atual = "";
  for (const palavra of palavras) {
    const teste = atual ? atual + " " + palavra : palavra;
    if (ctx.measureText(teste).width <= max || !atual) atual = teste;
    else { linhas.push(atual); atual = palavra; }
  }
  if (atual) linhas.push(atual);
  if (linhas.length <= maxLinhas) return linhas;
  const corte = linhas.slice(0, maxLinhas);
  corte[maxLinhas - 1] = encurtar(corte[maxLinhas - 1] + " " + linhas[maxLinhas].split(" ")[0], max);
  return corte;
}

/* --------------------------------------------------------------- desenho */
function redimensionar() {
  dpr = window.devicePixelRatio || 1;
  const l = canvas.clientWidth, a = canvas.clientHeight;
  const w = Math.max(1, Math.round(l * dpr)), h = Math.max(1, Math.round(a * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function desenhar() {
  redimensionar();
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const fundo = ctx.createRadialGradient(cw / 2, ch / 2, 0, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
  fundo.addColorStop(0, "#151b26");
  fundo.addColorStop(1, "#0b0e14");
  ctx.fillStyle = fundo;
  ctx.fillRect(0, 0, cw, ch);

  vista = transformacao();
  slots = construirSlots();
  const escala = vista.escala, cx = vista.cx, cy = vista.cy;

  for (const s of slots) {
    const ab = setorAbertura(s);
    const p = s.id ? P[s.id] : null;
    const caminho = new Path2D();
    caminho.arc(cx, cy, s.r1 * escala, ang(ab[0]), ang(ab[1]), false);
    caminho.arc(cx, cy, s.r0 * escala, ang(ab[1]), ang(ab[0]), true);
    caminho.closePath();
    s.caminho = caminho;
    s.aberto = ab;
    s.pessoa = p;
    s.midR = ((s.r0 + s.r1) / 2) * escala;
    s.radial = (s.r1 - s.r0) * escala;
    s.arco = (ab[1] - ab[0]) * RAD * s.midR;

    if (!p) {
      if (!state.vazios) continue;
      ctx.fillStyle = "rgba(255,255,255,0.02)";
      ctx.fill(caminho);
      ctx.save();
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = "rgba(255,255,255,0.09)";
      ctx.lineWidth = 1;
      ctx.stroke(caminho);
      ctx.restore();
      continue;
    }
    const cor = corDe(p, s.gen);
    s.cor = cor;
    ctx.fillStyle = p.stub ? rgba(cor, 0.14) : rgba(cor, 0.88);
    ctx.fill(caminho);
    ctx.save();
    if (p.stub) ctx.setLineDash([5, 4]);
    ctx.strokeStyle = p.stub ? rgba(cor, 0.5) : escurecer(cor, 0.55);
    ctx.lineWidth = 1;
    ctx.stroke(caminho);
    ctx.restore();
  }

  for (const s of slots) if (s.pessoa) rotular(s, cx, cy);

  const raiz = P[state.raiz];
  const hubR = Math.max(8, HOLE * escala);
  const corRaiz = corDe(raiz, 0);
  ctx.beginPath();
  ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
  ctx.fillStyle = rgba(corRaiz, 0.95);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = escurecer(corRaiz, 0.5);
  ctx.stroke();

  const tam = clamp(hubR * 0.23, 8.5, 13);
  ctx.font = "600 " + tam.toFixed(1) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#14181f";
  const linhas = quebrar(nomeDe(raiz), hubR * 1.62, 3);
  const alt = tam * 1.2;
  let y = cy - ((linhas.length - 1) * alt) / 2;
  for (const ln of linhas) { ctx.fillText(ln, cx, y); y += alt; }

  // os slots são recriados a cada desenho, por isso a comparação é feita
  // pela chave 'geraçao:índice' e não pela identidade do objecto
  const alvoKey = state.sobre === "raiz" ? "raiz" : state.sobre ? state.sobre.key : null;
  const selId = state.selecionado;
  for (const s of slots) {
    if (!s.pessoa) continue;
    if (alvoKey !== s.key && !(selId && s.id === selId)) continue;
    ctx.save();
    ctx.lineWidth = alvoKey === s.key ? 2.5 : 2;
    ctx.strokeStyle = alvoKey === s.key ? "#ffffff" : "#ffd166";
    ctx.stroke(s.caminho);
    ctx.restore();
  }
  if (alvoKey === "raiz" || selId === state.raiz) {
    ctx.beginPath();
    ctx.arc(cx, cy, hubR + 2, 0, Math.PI * 2);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = alvoKey === "raiz" ? "#ffffff" : "#ffd166";
    ctx.stroke();
  }
}

function rotular(s, cx, cy) {
  if (s.radial < 30 || s.arco < 12) return;
  const p = s.pessoa;
  const nome = state.curtos ? nomeCurto(p) : nomeDe(p);
  const extras = [];
  if (state.datas) { const a = anosDe(p); if (a) extras.push(a); }
  if (state.locais) { const l = localDe(p.nascimento) || localDe(p.obito); if (l) extras.push(l); }
  const duas = s.arco >= 30 && s.radial >= 44 && extras.length > 0;
  const linhas = duas ? [nome, extras.join("  ·  ")] : [nome];
  const radial = s.radial - 12;

  ctx.save();
  ctx.clip(s.caminho);
  ctx.translate(cx, cy);
  const bMid = (s.aberto[0] + s.aberto[1]) / 2;
  const invertido = Math.sin(bMid * RAD) < 0;
  ctx.rotate(ang(bMid) + (invertido ? Math.PI : 0));
  const x = invertido ? -s.midR : s.midR;
  const tam = clamp(s.radial / 6.2, 8.5, 13);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = p.stub ? "rgba(205,215,232,0.78)" : "#151a22";
  const alt = tam * 1.22;
  let y = -((linhas.length - 1) * alt) / 2;
  for (let i = 0; i < linhas.length; i++) {
    ctx.font = (i === 0 ? "600 " : "") + tam.toFixed(1) + "px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(encurtar(linhas[i], radial), x, y);
    y += alt;
  }
  ctx.restore();
}

let pendente = false;
function agendar() {
  if (pendente) return;
  pendente = true;
  requestAnimationFrame(() => { pendente = false; desenhar(); });
}

/* --------------------------------------------------------- interatividade */
function pos(ev) {
  const r = canvas.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function alvoEm(mx, my) {
  if (!vista) return null;
  const dx = mx - vista.cx, dy = my - vista.cy;
  const r = Math.hypot(dx, dy) / vista.escala;
  if (r <= HOLE) return "raiz";
  const b = Math.atan2(dx, -dy) / RAD;
  for (const s of slots) {
    if (r < s.r0 || r > s.r1) continue;
    // testa o sector inteiro (b0..b1) e nao o sector ja com o espaco
    // aplicado, para que os intervalos entre sectores continuem clicaveis
    if (dentro(b, s.b0, s.b1)) return s;
  }
  return null;
}
function contarDica(alvo, mx, my) {
  if (arrasto && arrasto.moveu) { dica.hidden = true; return; }
  const p = alvo === "raiz" ? P[state.raiz] : alvo && alvo.id ? P[alvo.id] : null;
  if (!p) { dica.hidden = true; return; }
  dica.textContent = "";
  dica.appendChild(el("b", null, nomeDe(p) + (p.stub ? "  (sem nota)" : "")));
  const partes = [];
  const n = conj(p.nascimento), o = conj(p.obito);
  if (n) partes.push("★ " + n);
  if (o) partes.push("† " + o);
  if (p.hipocoristico) partes.push("“" + p.hipocoristico + "”");
  if (p.apelidos.length) partes.push(p.apelidos.join(" · "));
  dica.appendChild(el("span", null, partes.length ? partes.join("   ") : "sem datas conhecidas"));
  dica.hidden = false;
  const r = canvas.getBoundingClientRect();
  let x = mx + 16, y = my + 16;
  const w = dica.offsetWidth, h = dica.offsetHeight;
  if (x + w > r.width - 8) x = Math.max(8, mx - w - 14);
  if (y + h > r.height - 8) y = Math.max(8, my - h - 14);
  dica.style.left = x + "px";
  dica.style.top = y + "px";
}

let arrasto = null;

canvas.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0) return;
  arrasto = { x: ev.clientX, y: ev.clientY, px: state.panX, py: state.panY, moveu: false };
  canvas.classList.add("a-mover");
});

canvas.addEventListener("mousemove", (ev) => {
  if (arrasto) return;
  const p = pos(ev);
  const alvo = alvoEm(p[0], p[1]);
  state.sobre = alvo;
  canvas.style.cursor = alvo && (alvo === "raiz" || alvo.id) ? "pointer" : "grab";
  contarDica(alvo, p[0], p[1]);
  agendar();
});

canvas.addEventListener("mouseleave", () => {
  if (arrasto) return;
  state.sobre = null;
  dica.hidden = true;
  agendar();
});

window.addEventListener("mousemove", (ev) => {
  if (!arrasto) return;
  const dx = ev.clientX - arrasto.x, dy = ev.clientY - arrasto.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) arrasto.moveu = true;
  if (arrasto.moveu) {
    state.panX = arrasto.px + dx;
    state.panY = arrasto.py + dy;
    dica.hidden = true;
    agendar();
  }
});

window.addEventListener("mouseup", (ev) => {
  if (!arrasto) return;
  const clique = !arrasto.moveu;
  arrasto = null;
  canvas.classList.remove("a-mover");
  if (!clique || !canvas.contains(ev.target)) return;
  const p = pos(ev);
  const alvo = alvoEm(p[0], p[1]);
  if (alvo === "raiz") abrirPessoa(state.raiz);
  else if (alvo && alvo.id) abrirPessoa(alvo.id);
  else fecharPainel();
});

canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const p = pos(ev);
  const antes = state.zoom;
  state.zoom = clamp(antes * Math.exp(-ev.deltaY * 0.0015), 30, 260);
  const k = state.zoom / antes;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  state.panX = p[0] - cw / 2 - (p[0] - cw / 2 - state.panX) * k;
  state.panY = p[1] - ch / 2 - (p[1] - ch / 2 - state.panY) * k;
  sincronizar();
  agendar();
}, { passive: false });

window.addEventListener("keydown", (ev) => {
  if (ev.target && /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
  const k = ev.key;
  if (k === "Escape") fecharPainel();
  else if (k === "r" || k === "R") recentrar();
  else if (k === "+" || k === "=") { state.zoom = clamp(state.zoom + 15, 30, 260); sincronizar(); agendar(); }
  else if (k === "-") { state.zoom = clamp(state.zoom - 15, 30, 260); sincronizar(); agendar(); }
  else if (k === "ArrowLeft") { state.rotacao -= 5; sincronizar(); agendar(); }
  else if (k === "ArrowRight") { state.rotacao += 5; sincronizar(); agendar(); }
  else if (k === "ArrowUp") { state.geracoes = clamp(state.geracoes + 1, 1, 8); sincronizar(); agendar(); }
  else if (k === "ArrowDown") { state.geracoes = clamp(state.geracoes - 1, 1, 8); sincronizar(); agendar(); }
});

window.addEventListener("resize", agendar);

/* ------------------------------------------------------- painel lateral */
function uriObsidian(rel) {
  return "obsidian://open?vault=" + encodeURIComponent(VAULT) + "&file=" + encodeURIComponent(rel);
}
function atrib(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function ddPeriodo(o) {
  const d = el("div");
  const t = dataPt(o);
  if (t) d.appendChild(el("span", null, t));
  const l = localDe(o);
  if (l) {
    const a = el("a", null, (t ? " · " : "") + l);
    a.href = uriObsidian("Locais/" + l);
    a.style.cssText = "color:var(--acento2);text-decoration:none";
    d.appendChild(a);
  }
  if (!t && !l) d.appendChild(el("span", null, "—"));
  return d;
}

function botaoPessoa(id, papel, quando) {
  const q = P[id];
  const b = el("button", "pessoa" + (q.stub ? " novo" : ""));
  const ponto = el("span", "ponto");
  ponto.style.background = PALETA[q.apelido] || PALETA.outro;
  b.appendChild(ponto);
  if (papel) b.appendChild(el("span", "papel", papel));
  b.appendChild(el("span", "quem", nomeDe(q)));
  const anos = anosDe(q);
  if (anos) b.appendChild(el("span", "quando", anos));
  else if (quando) b.appendChild(el("span", "quando", quando));
  b.onclick = () => abrirPessoa(id);
  return b;
}

function secaoLista(titulo, itens, pai) {
  const validos = itens.filter((i) => i && P[i.id]);
  if (!validos.length) return;
  const sec = el("section", "sec");
  sec.appendChild(el("h3", null, titulo));
  const caixa = el("div", "lista");
  for (const i of validos) caixa.appendChild(botaoPessoa(i.id, i.papel, i.quando));
  sec.appendChild(caixa);
  pai.appendChild(sec);
}

function notasHtml(texto) {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s)
    .replace(/\[\[([^\[\]|]+)(?:\|([^\[\]]+))?\]\]/g, (m, t, l) => {
      const nome = l || t;
      return P[t] ? '<a data-p="' + atrib(t) + '">' + esc(nome) + "</a>"
                  : '<span class="wl sem">' + esc(nome) + "</span>";
    })
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const saida = [];
  let lista = false;
  for (const linha of String(texto).split(/\r?\n/)) {
    const t = linha.trim();
    if (/^[-•]\s+/.test(t)) {
      if (!lista) { saida.push("<ul>"); lista = true; }
      saida.push("<li>" + inline(t.replace(/^[-•]\s+/, "")) + "</li>");
      continue;
    }
    if (lista) { saida.push("</ul>"); lista = false; }
    if (!t) continue;
    const forte = /^\*\*([^*]+)\*\*:?$/.exec(t);
    saida.push(forte ? "<p><strong>" + esc(forte[1]) + "</strong></p>" : "<p>" + inline(t) + "</p>");
  }
  if (lista) saida.push("</ul>");
  return saida.join("");
}

function abrirPessoa(id) {
  const p = P[id];
  if (!p) return;
  state.selecionado = id;
  painel.classList.add("aberto");
  desenharPainel(p);
  agendar();
}

function fecharPainel() {
  painel.classList.remove("aberto");
  state.selecionado = null;
  agendar();
}

function desenharPainel(p) {
  document.getElementById("pNome").textContent = nomeDe(p);
  const sub = [];
  const anos = anosDe(p);
  if (anos) sub.push(anos);
  if (p.hipocoristico) sub.push("“" + p.hipocoristico + "”");
  sub.push(p.stub ? "sem nota" : p.id);
  document.getElementById("pSub").textContent = sub.join("  ·  ");

  const corpo = document.getElementById("corpoPainel");
  corpo.textContent = "";

  const acoes = el("div", "acoes");
  const bCentrar = el("button", "bt principal", "Centrar aqui");
  bCentrar.onclick = () => {
    state.raiz = p.id;
    recentrar();
    abrirPessoa(p.id);
  };
  acoes.appendChild(bCentrar);
  if (!p.stub && p.nota) {
    const bNota = el("button", "bt", "Obsidian");
    bNota.onclick = () => { window.location.href = uriObsidian(p.nota); };
    acoes.appendChild(bNota);
  }
  corpo.appendChild(acoes);

  const sec = el("section", "sec");
  sec.appendChild(el("h3", null, "Dados"));
  const dl = el("dl", "dados");
  const addLinha = (rotulo, valor) => {
    if (!valor) return;
    dl.appendChild(el("dt", null, rotulo));
    const dd = el("dd");
    if (valor instanceof Node) dd.appendChild(valor);
    else dd.textContent = valor;
    dl.appendChild(dd);
  };
  addLinha("Nascimento", ddPeriodo(p.nascimento));
  addLinha("Batismo", (dataPt(p.batismo) || localDe(p.batismo)) ? ddPeriodo(p.batismo) : null);
  addLinha("Óbito", ddPeriodo(p.obito));
  addLinha("Hipocor.", p.hipocoristico || null);
  if (p.apelidos.length) {
    const dd = el("dd");
    for (const a of p.apelidos) {
      const c = el("span", "chip");
      const ponto = el("span", "ponto");
      ponto.style.background = PALETA[a.toLowerCase()] || PALETA.outro;
      c.appendChild(ponto);
      c.appendChild(document.createTextNode(a));
      dd.appendChild(c);
    }
    dl.appendChild(el("dt", null, "Apelidos"));
    dl.appendChild(dd);
  }
  addLinha("Sexo", p.sex === "F" ? "feminino" : p.sex === "M" ? "masculino" : null);
  sec.appendChild(dl);
  corpo.appendChild(sec);

  secaoLista("Pais", [
    p.pai ? { id: p.pai, papel: "Pai" } : null,
    p.mae ? { id: p.mae, papel: "Mãe" } : null,
  ], corpo);

  secaoLista("Cônjuges", p.conjuges.map((c) => ({
    id: c.id,
    quando: [c.data, c.local].filter(Boolean).join(", "),
  })), corpo);

  secaoLista("Irmãos", p.irmaos.map((id) => ({ id: id })), corpo);
  secaoLista("Filhos", p.filhos.map((id) => ({ id: id })), corpo);

  if (p.notas) {
    const s = el("section", "sec");
    s.appendChild(el("h3", null, "Notas"));
    const d = el("div", "notas");
    d.innerHTML = notasHtml(p.notas);
    s.appendChild(d);
    corpo.appendChild(s);
  }

  if (p.documentos && p.documentos.length) {
    const s = el("section", "sec");
    s.appendChild(el("h3", null, "Documentos"));
    const caixa = el("div", "docs");
    for (const doc of p.documentos) {
      const a = el("a", null, doc.label || doc.file);
      a.href = uriObsidian("Documentos/" + doc.file);
      a.title = doc.file;
      caixa.appendChild(a);
    }
    s.appendChild(caixa);
    corpo.appendChild(s);
  }

  const rodape = el("div", "rodape");
  if (p.stub) {
    rodape.innerHTML = "Sem nota em <code>Pessoas/</code>" +
      (p.irmaos.length || p.filhos.length || p.pai || p.mae
        ? " — as relações foram deduzidas das notas de outros familiares." : ".");
  } else {
    const linhas = ["<code>" + atrib(p.nota || "") + "</code>"];
    if (p.criado) linhas.push("criado em " + atrib(p.criado));
    if (p.tags && p.tags.length) linhas.push(atrib(p.tags.join("  ")));
    rodape.innerHTML = linhas.join("<br>");
  }
  corpo.appendChild(rodape);
  corpo.scrollTop = 0;
}

/* ------------------------------------------------------------- controlos */
const UI = {
  busca: document.getElementById("busca"),
  resultados: document.getElementById("resultados"),
  geracoes: document.getElementById("geracoes"),
  abertura: document.getElementById("abertura"),
  rotacao: document.getElementById("rotacao"),
  espaco: document.getElementById("espaco"),
  zoom: document.getElementById("zoom"),
  cores: document.getElementById("cores"),
  ckDatas: document.getElementById("ckDatas"),
  ckLocais: document.getElementById("ckLocais"),
  ckVazios: document.getElementById("ckVazios"),
  ckCurtos: document.getElementById("ckCurtos"),
  vGeracoes: document.getElementById("vGeracoes"),
  vAbertura: document.getElementById("vAbertura"),
  vRotacao: document.getElementById("vRotacao"),
  vEspaco: document.getElementById("vEspaco"),
  vZoom: document.getElementById("vZoom"),
  btRecentrar: document.getElementById("btRecentrar"),
  btPng: document.getElementById("btPng"),
  alternar: document.getElementById("alternarControlos"),
  controlos: document.getElementById("controlos"),
};

function sincronizar() {
  UI.geracoes.value = state.geracoes;
  UI.vGeracoes.textContent = state.geracoes + (state.geracoes === 1 ? " anel" : " anéis");
  UI.abertura.value = state.abertura;
  UI.vAbertura.textContent = state.abertura + "°";
  UI.rotacao.value = state.rotacao;
  UI.vRotacao.textContent = state.rotacao + "°";
  UI.espaco.value = state.espaco;
  UI.vEspaco.textContent = state.espaco + "°";
  UI.zoom.value = state.zoom;
  UI.vZoom.textContent = state.zoom + "%";
  UI.cores.value = state.cores;
  UI.ckDatas.checked = state.datas;
  UI.ckLocais.checked = state.locais;
  UI.ckVazios.checked = state.vazios;
  UI.ckCurtos.checked = state.curtos;
}

function recentrar() {
  state.panX = 0;
  state.panY = 0;
  state.zoom = 100;
  sincronizar();
  agendar();
}

function profundidade(id) {
  let n = 0;
  let atual = [id];
  while (atual.length && n < 8) {
    const prox = [];
    for (const x of atual) {
      const p = P[x];
      if (!p) continue;
      if (p.pai) prox.push(p.pai);
      if (p.mae) prox.push(p.mae);
    }
    if (!prox.length) break;
    n++;
    atual = prox;
  }
  return n;
}

const TODOS = Object.values(P).sort((a, b) =>
  (a.stub ? 1 : 0) - (b.stub ? 1 : 0) || nomeDe(a).localeCompare(nomeDe(b), "pt"));

function procurar(q) {
  const termos = norm(q).split(/\s+/).filter(Boolean);
  if (!termos.length) return [];
  const saida = [];
  for (const p of TODOS) {
    const alvo = norm(p.id + " " + p.nome + " " + p.desambiguacao + " " + p.apelidos.join(" "));
    if (termos.every((t) => alvo.indexOf(t) >= 0)) saida.push(p);
    if (saida.length >= 8) break;
  }
  return saida;
}

function mostrarResultados() {
  const termo = UI.busca.value.trim();
  const lista = termo ? procurar(termo) : [];
  UI.resultados.textContent = "";
  if (termo && !lista.length) {
    UI.resultados.appendChild(el("small", null, "sem resultados"));
    return;
  }
  for (const p of lista) {
    const b = el("button");
    const ponto = el("span", "ponto");
    ponto.style.background = PALETA[p.apelido] || PALETA.outro;
    b.appendChild(ponto);
    b.appendChild(el("span", null, nomeDe(p)));
    b.appendChild(el("small", null, anosDe(p)));
    b.onclick = () => {
      irPara(p.id);
      UI.busca.value = "";
      UI.resultados.textContent = "";
    };
    UI.resultados.appendChild(b);
  }
}

function irPara(id) {
  state.raiz = id;
  state.geracoes = clamp(profundidade(id) || 1, 1, 8);
  recentrar();
  abrirPessoa(id);
}

UI.busca.addEventListener("input", mostrarResultados);
UI.busca.addEventListener("focus", mostrarResultados);
UI.busca.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    const lista = procurar(UI.busca.value);
    if (lista.length) {
      irPara(lista[0].id);
      UI.busca.value = "";
      UI.resultados.textContent = "";
    }
  } else if (ev.key === "Escape") {
    UI.busca.value = "";
    UI.resultados.textContent = "";
    UI.busca.blur();
  }
});

UI.geracoes.addEventListener("input", () => { state.geracoes = +UI.geracoes.value; sincronizar(); agendar(); });
UI.abertura.addEventListener("input", () => { state.abertura = +UI.abertura.value; sincronizar(); agendar(); });
UI.rotacao.addEventListener("input", () => { state.rotacao = +UI.rotacao.value; sincronizar(); agendar(); });
UI.espaco.addEventListener("input", () => { state.espaco = +UI.espaco.value; sincronizar(); agendar(); });
UI.zoom.addEventListener("input", () => { state.zoom = +UI.zoom.value; sincronizar(); agendar(); });
UI.cores.addEventListener("change", () => { state.cores = UI.cores.value; agendar(); });
UI.ckDatas.addEventListener("change", () => { state.datas = UI.ckDatas.checked; agendar(); });
UI.ckLocais.addEventListener("change", () => { state.locais = UI.ckLocais.checked; agendar(); });
UI.ckVazios.addEventListener("change", () => { state.vazios = UI.ckVazios.checked; agendar(); });
UI.ckCurtos.addEventListener("change", () => { state.curtos = UI.ckCurtos.checked; agendar(); });
UI.btRecentrar.addEventListener("click", recentrar);
UI.alternar.addEventListener("click", () => {
  UI.controlos.classList.toggle("fechado");
  UI.alternar.textContent = UI.controlos.classList.contains("fechado") ? "▸" : "▾";
});

UI.btPng.addEventListener("click", () => {
  const selecionado = state.selecionado, sobre = state.sobre;
  state.selecionado = null;
  state.sobre = null;
  dica.hidden = true;
  desenhar();
  canvas.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "arvore-" + state.raiz.replace(/\s+/g, "-") + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    state.selecionado = selecionado;
    state.sobre = sobre;
    agendar();
  }, "image/png");
});

document.getElementById("btFechar").addEventListener("click", fecharPainel);
document.getElementById("corpoPainel").addEventListener("click", (ev) => {
  const alvo = ev.target && ev.target.closest ? ev.target.closest("[data-p]") : null;
  if (alvo) {
    ev.preventDefault();
    abrirPessoa(alvo.getAttribute("data-p"));
  }
});

/* ------------------------------------------------------------------ arranque */
function iniciar() {
  state.geracoes = clamp(profundidade(state.raiz) || 1, 2, 5);
  sincronizar();
  const m = DATA.meta;
  hud.textContent = m.pessoas + " pessoas  ·  " + m.comNota + " com nota  ·  " +
    "gerado a " + m.gerado + "  ·  roda para ampliar, arrasta para mover";
  desenhar();
  abrirPessoa(state.raiz);
}

iniciar();
})();
</script>
